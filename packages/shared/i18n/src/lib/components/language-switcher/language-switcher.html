<button
  type="button"
  class="grid h-10 w-10 place-items-center rounded-full border-0 bg-[#ff4100] text-white shadow-[0_4px_12px_rgb(255_65_0_/_35%)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:shadow-[0_6px_16px_rgb(255_65_0_/_50%)] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#ff410059]"
  [attr.aria-label]="(currentLang() === 'en' ? 'ui.language.switchToArabic' : 'ui.language.switchToEnglish') | translate"
  (click)="toggleLanguage()">
  <lib-field-icon name="globe" [size]="22" />
</button>
