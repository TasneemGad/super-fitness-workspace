<dialog #dialog class="gallery" (close)="onClose()">
  <div class="gallery-frame">
    <button
      type="button"
      class="gallery-close"
      [attr.aria-label]="'ui.gallery.close' | translate"
      (click)="open.set(false)"
    >
      <lib-field-icon name="close" [size]="18" />
    </button>

    @if (current(); as src) {
      <img class="gallery-image" [src]="src" [alt]="(alt() ?? ('ui.gallery.imageAlt' | translate)) + ' ' + (index() + 1)" />
    }

    @if (images().length > 1) {
      <button
        type="button"
        class="gallery-nav prev"
        [attr.aria-label]="'ui.gallery.previous' | translate"
        (click)="step(-1)"
      >
        <lib-field-icon name="chevron-left" [size]="20" />
      </button>
      <button
        type="button"
        class="gallery-nav next"
        [attr.aria-label]="'ui.gallery.next' | translate"
        (click)="step(1)"
      >
        <lib-field-icon name="chevron-right" [size]="20" />
      </button>

      <div class="gallery-dots">
        @for (image of images(); track $index) {
          <button
            type="button"
            class="gallery-dot"
            [class.active]="$index === index()"
            [attr.aria-label]="'ui.gallery.showImage' | translate: { index: $index + 1 }"
            [attr.aria-current]="$index === index() || null"
            (click)="index.set($index)"
          ></button>
        }
      </div>
    }
  </div>
</dialog>
