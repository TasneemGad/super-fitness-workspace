<main class="auth-page">
  <div class="auth-area">
    <lib-auth-header
      [title]="'auth.changePassword.title' | translate"
      [subtitle]="'auth.changePassword.subtitle' | translate" />

    <section class="auth-card">
      @if (done()) {
        <div class="auth-success" role="status">
          <span class="auth-success-badge" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 5 5L20 7" />
            </svg>
          </span>
          <h2>{{ 'auth.changePassword.submit' | translate }}</h2>
          <p>{{ 'auth.changePassword.submitting' | translate }}</p>
        </div>
      } @else {
        <h2 class="auth-title">{{ 'auth.changePassword.title' | translate }}</h2>

        <app-auth-feedback [errors]="errors()" />

        <lib-dynamic-form
          class="auth-form"
          [fields]="fields()"
          [submitting]="submitting()"
          [disableSubmitWhenInvalid]="false"
          [submitLabel]="'auth.changePassword.submit' | translate"
          [loadingLabel]="'auth.changePassword.submitting' | translate"
          (formSubmit)="onSubmit($event)" />
      }
    </section>
  </div>
</main>
