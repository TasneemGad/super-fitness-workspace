<main class="auth-shell">
      <section class="auth-card" aria-labelledby="change-password-title">
        <div class="brand-block">
          <span class="brand-mark">S</span>
          <span class="brand-name">{{ 'app.name' | translate | uppercase }}</span>
        </div>

        <h1 id="change-password-title">{{ 'auth.changePassword.title' | translate }}</h1>
        <p class="subtitle">{{ 'auth.changePassword.subtitle' | translate }}</p>

        @if (authStore.error$ | async; as error) {
          <p class="error-message" role="alert">{{ error | translate }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="field">
            <span>{{ 'auth.changePassword.currentPassword' | translate }}</span>
            <input
              type="password"
              formControlName="oldPassword"
              [placeholder]="'auth.changePassword.currentPassword' | translate"
            />
          </label>

          <label class="field">
            <span>{{ 'auth.changePassword.newPassword' | translate }}</span>
            <input
              type="password"
              formControlName="newPassword"
              [placeholder]="'auth.changePassword.newPasswordPlaceholder' | translate"
            />
          </label>

          <button type="submit" [disabled]="(loading$ | async) ?? false">
            {{ ((loading$ | async) ? 'auth.changePassword.submitting' : 'auth.changePassword.submit') | translate }}
          </button>
        </form>
      </section>
    </main>
