<div class="rs-page">
  <div class="rs-content">
    <lib-step-progress class="rs-progress" [current]="currentStep()" [total]="totalSteps()" />

    <div class="rs-heading">
      <lib-question-title [text]="title()" />
      <lib-question-description [text]="description()" />
    </div>

    <div class="choice-options" role="radiogroup" [attr.aria-label]="title()">
      @for (option of options(); track option.value) {
        @let selected = value() === option.value;
        <button type="button" role="radio" class="choice-option" [class.choice-option--selected]="selected"
          [attr.aria-checked]="selected" (click)="value.set(option.value)">
          <span>{{ option.labelKey | translate }}</span>
          <span class="choice-indicator" aria-hidden="true"></span>
        </button>
      }
    </div>

    @if (errors().length) {
      <ul class="choice-errors" role="alert">
        @for (error of errors(); track error) {
          <li>{{ error }}</li>
        }
      </ul>
    }

    <button type="button" class="rs-next choice-next" [disabled]="value() === null || submitting()"
      [attr.aria-busy]="submitting()" (click)="onNext()">
      {{ nextLabel() }}
    </button>
  </div>
</div>
