<h2 class="auth-title">Register</h2>

<app-auth-feedback [errors]="stepper.errors()" [notice]="notice()" />

<lib-dynamic-form
  class="auth-form"
  [fields]="fields()"
  [initialData]="stepper.draft()"
  [submitting]="stepper.submitting()"
  [disableSubmitWhenInvalid]="false"
  submitLabel="Register"
  (formSubmit)="onSubmit($event)"
>
  <div formBeforeSubmit>
    <div class="auth-row-end">
      <a class="auth-link auth-link--strong" routerLink="/auth/forgot-password">
        Forget Password ?
      </a>
    </div>

    <app-social-sign-in (providerSelected)="onUnavailable($event)" />
  </div>

  <p formAfterSubmit class="auth-footnote">
    Already Have An Account ?
    <a class="auth-link auth-link--strong" routerLink="/auth/login">Login</a>
  </p>
</lib-dynamic-form>
