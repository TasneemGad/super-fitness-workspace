<main class="auth-page">
  <div class="auth-area">
    <lib-auth-header [title]="done() ? 'Password Updated' : 'Create New Password'" />

    <section class="auth-card">
      @if (done()) {
      <div class="auth-success" role="status">
        <span class="auth-success-badge" aria-hidden="true">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m5 12 5 5L20 7" />
          </svg>
        </span>

        <h2>Your password has been reset</h2>
        <p>Taking you back to login so you can sign in with it.</p>

        <a class="auth-link auth-link--strong" routerLink="../../login">Go to login</a>
      </div>
      } @else {
      <h2 class="auth-title">Make Sure Its 8 Characters Or More</h2>

      <app-auth-feedback [errors]="errors()" />

      <lib-dynamic-form
        class="auth-form"
        [fields]="fields"
        [submitting]="submitting()"
        [disableSubmitWhenInvalid]="false"
        submitLabel="Done"
        loadingLabel="Saving..."
        (formSubmit)="onSubmit($event)"
      />
      }
    </section>
  </div>
</main>
