<main class="auth-page">
  <div class="auth-area">
    <lib-auth-header [title]="'auth.forgotPassword.header' | translate" />

    <section class="auth-card">
      <h2 class="auth-title">{{ 'auth.forgotPassword.title' | translate }}</h2>

      <app-auth-feedback [errors]="errors()" />

      <lib-dynamic-form
        class="auth-form"
        [fields]="fields()"
        [initialData]="initialData()"
        [submitting]="submitting()"
        [disableSubmitWhenInvalid]="false"
        [submitLabel]="'auth.forgotPassword.submit' | translate"
        [loadingLabel]="'auth.forgotPassword.submitting' | translate"
        (formSubmit)="onSubmit($event)"
      />

    </section>
  </div>
</main>
