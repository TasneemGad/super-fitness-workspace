<main class="auth-page">
  <div class="auth-area">
    <lib-auth-header title="Forget Password" />

    <section class="auth-card">
      <h2 class="auth-title">Enter Your Email</h2>

      <app-auth-feedback [errors]="errors()" />

      <lib-dynamic-form
        class="auth-form"
        [fields]="fields"
        [initialData]="initialData"
        [submitting]="submitting()"
        [disableSubmitWhenInvalid]="false"
        submitLabel="Send OTP"
        loadingLabel="Sending..."
        (formSubmit)="onSubmit($event)"
      >
        <p formAfterSubmit class="auth-footnote">
          Remember Your Password ?
          <a class="auth-link" routerLink="../login">Login</a>
        </p>
      </lib-dynamic-form>
    </section>
  </div>
</main>
