<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      let theme = 'dark';
      try {
        if (localStorage.getItem('super-fitness.theme') === 'light') {
          theme = 'light';
        }
      } catch {}
      document.documentElement.classList.toggle('dark', theme === 'dark');
    </script>
    <title>superFitness</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-super-fitness-entry></app-super-fitness-entry>
  </body>
</html>
