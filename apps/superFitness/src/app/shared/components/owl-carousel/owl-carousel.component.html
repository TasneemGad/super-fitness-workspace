<owl-carousel-o [options]="carouselOptions()">
  @for (item of items(); track itemId()(item)) {
    <ng-template carouselSlide [id]="itemId()(item)">
      <ng-container
        [ngTemplateOutlet]="slideTemplate"
        [ngTemplateOutletContext]="{ $implicit: item }"
      />
    </ng-template>
  }
</owl-carousel-o>
