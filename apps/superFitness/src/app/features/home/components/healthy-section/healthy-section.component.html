<section
  class="healthy-section relative flex min-h-[48rem] w-full flex-col items-center overflow-hidden bg-[#F3F3F4] px-[clamp(1rem,5.56vw,5rem)]">
  <!--  Overlay -->
  <div class="pointer-events-none absolute left-0 top-[57px] z-0 h-[414px] w-full bg-[#FFFFFF99] backdrop-blur-[43px]">
  </div>

  <div class="relative z-10 mx-auto w-full ">
    <lib-section-title [primaryText]="'home.healthy.title' | translate"
      [secondaryText]="'home.healthy.subtitle' | translate" size="sm" [primaryTextFontSize]="64"
      [secondaryTextFontSize]="13.1" />

    <lib-paragraph-title [segments]="[
    { text: 'home.healthy.descriptionPrefix' | translate },
    { text: 'home.healthy.descriptionHighlight' | translate, highlight: true },
    { text: 'home.healthy.descriptionSuffix' | translate }
  ]" align="center" />

    @if (isLoading()) {
    <p class="mt-8 text-center text-lg text-[#242424]" role="status">
      {{ 'home.healthy.loading' | translate }}
    </p>
    } @else if (errorMessage()) {
    <p class="mt-8 text-center text-lg text-[#242424]" role="alert">
      {{ errorMessage() | translate }}
    </p>
    } @else if (mealCategories().length > 0) {
    <div class="mt-8 w-full">
       <app-owl-carousel
    [items]="mealCategories()"
    [options]="customOptions"
    [itemId]="getCategoryId"
  >
    <ng-template #slide let-category>
      <app-info-card
        [image]="category.strCategoryThumb"
        [title]="(category.strCategory) "
        buttonText="home.healthy.readMore"
      />
    </ng-template>
  </app-owl-carousel>
    </div>
    } @else {
    <p class="mt-8 text-center text-lg text-[#242424]">
      {{ 'home.healthy.empty' | translate }}
    </p>
    }
  </div>

  <app-fitness-marquee />
  <app-smart-coach/>
</section>
