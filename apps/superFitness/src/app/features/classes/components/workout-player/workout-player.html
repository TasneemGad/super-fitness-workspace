<section class="@container relative isolate aspect-[839/536] w-full max-w-[980px] overflow-hidden
         rounded-t-[clamp(0.75rem,1.4vw,1.25rem)] bg-[#242424]">

  @if (isPlaying() && embedUrl()) {

  <!-- Video: fills the whole card -->
  <iframe class="absolute inset-0 z-10 size-full" [src]="embedUrl()!" [title]="title()"
    allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>

  } @else {

  <!-- Layer 1: thumbnail (background) -->
  @if (poster()) {
  <img [src]="poster()" [alt]="title()" class="absolute inset-0 -z-20 size-full object-cover" />
  }

    <!-- Layer 2: gradient + blur (bottom 60% only) -->
   <div class="absolute inset-0 -z-10
            bg-[linear-gradient(180deg,rgba(243,243,244,0)_0%,rgba(243,243,244,0)_35%,rgba(243,243,244,0.95)_80%)]
            dark:bg-[linear-gradient(180deg,rgba(36,36,36,0)_0%,rgba(36,36,36,0)_35%,rgba(36,36,36,0.95)_80%)]"></div>
  <!-- Layer 3: play button -->
  @if (videoUrl()) {
  <button type="button" (click)="play()" aria-label="Play" 
  class="absolute left-1/2 top-1/2 z-10 grid -translate-x-1/2 -translate-y-1/2 place-items-center
               rounded-full bg-[#FF4100]/40 
               transition-transform duration-200 hover:scale-110
               focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-4
               focus-visible:outline-[#FF4100]/50
               size-[clamp(2.75rem,1.6rem+3vw,5rem)]">

    <span class="grid size-[75%] place-items-center rounded-full bg-[#FF4100]/60">
      <span class="grid size-[66%] place-items-center rounded-full bg-[#FF4100] text-[#F3F3F4]">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          class="size-[45%] translate-x-[8%] rtl:-translate-x-[8%] rtl:-scale-x-100">
          <path d="M8 5v14l11-7z" />
        </svg>
      </span>
    </span>
  </button>
  }

  <!-- Layer 4: text content (bottom) -->
  <div class="absolute inset-x-0 bottom-0 z-10 flex flex-col 
             gap-[clamp(0.25rem,0.6vw,0.75rem)]  px-[clamp(0.75rem,3.8cqw,2rem)] pb-[clamp(0.625rem,3.8cqw,2rem)]">

    <h1 class="font-['Baloo_Thambi_2'] text-center font-medium capitalize leading-[1.3] text-[#F3F3F4]
               text-[clamp(1.125rem,0.8rem+1.4vw,2rem)]">
      {{ title() }}
    </h1>

    @if (description()) {
    <p class="line-clamp-2 max-w-[70ch] leading-[1.6] text-[#F3F3F4]/80
                 text-[clamp(0.6875rem,0.55rem+0.4vw,1rem)]">
      {{ description() }}
    </p>
    }

    <div class="mt-1 flex items-center justify-between gap-3">
      @if (duration()) {
      <span class="inline-flex items-center rounded-full border border-[#F3F3F4]/40
                   bg-black/30 text-[#F3F3F4] backdrop-blur-sm
                   px-[clamp(0.5rem,1vw,1rem)] py-[clamp(0.125rem,0.4vw,0.375rem)]
                   text-[clamp(0.625rem,0.5rem+0.35vw,0.9rem)]">
        {{ duration() }}
      </span>
      }

      @if (level()) {
      <span class="inline-flex items-center rounded-full font-medium text-[#F3F3F4]
                   px-[clamp(0.625rem,1.2vw,1.25rem)] py-[clamp(0.125rem,0.4vw,0.375rem)]
                   text-[clamp(0.625rem,0.5rem+0.35vw,0.9rem)]">
        {{ level() }}
      </span>
      }
    </div>
  </div>
  }
</section>
