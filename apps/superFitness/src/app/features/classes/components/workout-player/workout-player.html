<section
  class="relative isolate aspect-[839/536] w-full max-w-[980px] overflow-hidden
         rounded-t-[clamp(0.75rem,1.4vw,1.25rem)] bg-[#242424]">

  @if (isPlaying() && embedUrl()) {

    <!-- Video: fills the whole card -->
    <iframe
      class="absolute inset-0 z-10 size-full"
      [src]="embedUrl()!"
      [title]="title()"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen></iframe>

  } @else {

    <!-- Layer 1: thumbnail (background) -->
    @if (poster()) {
      <img
        [src]="poster()"
        [alt]="title()"
        class="absolute inset-0 -z-20 size-full object-cover" />
    }

    <!-- Layer 2: gradient + blur (bottom 60% only) -->
    <div
      class="absolute inset-x-0 bottom-0 -z-10 h-[60%]
             bg-[linear-gradient(180deg,rgba(0,0,0,0.095)_3.06%,rgba(36,36,36,0.95)_63.13%)]
             backdrop-blur-[16px] md:backdrop-blur-[55px]
             [mask-image:linear-gradient(to_top,black_70%,transparent)]">
    </div>

    <!-- Layer 3: play button -->
    @if (videoUrl()) {
      <button
        type="button"
        (click)="play()"
        aria-label="Play"
        class="absolute left-1/2 top-[38%] z-10 grid -translate-x-1/2 -translate-y-1/2 place-items-center
               rounded-full bg-[#FF4100] text-[#F3F3F4]
               shadow-[0_6px_24px_rgb(255_65_0/45%)]
               transition-transform duration-200 hover:scale-110
               focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-4
               focus-visible:outline-[#FF4100]/50
               size-[clamp(2.75rem,1.6rem+3vw,5rem)]">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
             class="size-[40%] translate-x-[8%] rtl:-translate-x-[8%] rtl:-scale-x-100">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
    }

    <!-- Layer 4: text content (bottom) -->
    <div
      class="absolute inset-x-0 bottom-0 z-10 flex flex-col
             gap-[clamp(0.25rem,0.6vw,0.75rem)] p-[clamp(0.75rem,2vw,2rem)]">

      <h1
        class="font-['Baloo_Thambi_2'] font-medium capitalize leading-[1.3] text-[#F3F3F4]
               text-[clamp(1.125rem,0.8rem+1.4vw,2rem)]">
        {{ title() }}
      </h1>

      @if (description()) {
        <p
          class="line-clamp-2 max-w-[70ch] leading-[1.6] text-[#F3F3F4]/80
                 text-[clamp(0.6875rem,0.55rem+0.4vw,1rem)]">
          {{ description() }}
        </p>
      }

      <div class="mt-1 flex items-center justify-between gap-3">
        @if (duration()) {
          <span
            class="inline-flex items-center rounded-full border border-[#F3F3F4]/40
                   bg-black/30 text-[#F3F3F4] backdrop-blur-sm
                   px-[clamp(0.5rem,1vw,1rem)] py-[clamp(0.125rem,0.4vw,0.375rem)]
                   text-[clamp(0.625rem,0.5rem+0.35vw,0.9rem)]">
            {{ duration() }}
          </span>
        }

        @if (level()) {
          <span
            class="inline-flex items-center rounded-full bg-[#FF4100] font-medium text-[#F3F3F4]
                   px-[clamp(0.625rem,1.2vw,1.25rem)] py-[clamp(0.125rem,0.4vw,0.375rem)]
                   text-[clamp(0.625rem,0.5rem+0.35vw,0.9rem)]">
            {{ level() }}
          </span>
        }
      </div>
    </div>
  }
</section>
